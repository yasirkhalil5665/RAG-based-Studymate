services:
  - type: web
    name: studymate
    runtime: docker
    plan: standard
    healthCheckPath: /health
    disk:
      name: studymate-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - fromGroup: studymate-env
      - key: STORAGE_DIR
        value: /data
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: LLM_MODEL
        value: gemma4:31b
