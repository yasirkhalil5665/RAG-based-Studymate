services:
  - type: web
    name: studymate
    runtime: docker
    plan: standard
    healthCheckPath: /health
    disk:
      name: studymate-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: STORAGE_DIR
        value: /data
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile

